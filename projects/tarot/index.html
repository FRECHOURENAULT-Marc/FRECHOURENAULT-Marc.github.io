<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Compteur Tarot</title>
    <!-- <link rel="stylesheet" href="css/main.css" /> -->
    <!-- <link rel="icon" href="res/logo-mfr.png" sizes="64x64" type="image/png"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--<script src="js/animations.js"></script> -->
</head>

<body>
  <main>

    <div id="scoreboard">
      <p id="add_player">Ajouter un joueur</p>
      <p id="remove_player">Retirer un joueur</p>

      <div id="player_names" style="display: flex; justify-content: space-between;">
      </div>
      <div id="player_scores" style="display: flex; justify-content: space-between;"> 
      </div>

    </div>

    <div> <!-- Slider Contract -->
      <label for="contract_slider" style="display: block; margin-bottom: 10px; margin-top: 20px;">
        Contrat : <span id="contract_text"></span>
      </label>
      <input id="contract_slider" type="range" min="0" max="3" value="0">

    </div>

    <div> <!-- Slider Oudler -->
      <label for="oudler_slider" style="display: block; margin-bottom: 10px;">
        Nombre de bouts : <span id="oudler_text"></span>
      </label>
      <input id="oudler_slider" type="range" min="0" max="3" value="0">
    </div>

    <div> <!-- Slider Score -->
      <label for="score_slider" style="display: block; margin-bottom: 10px;">
        Score de l'attaque : <span id="score_text"></span>
      </label>
      <input id="score_slider" type="range" min="0" max="90" step="10" value="0">
    </div> 

    <p id="win_message"></p>
    <p id="score_message">Déplace les jauges pour obtenir un score.</p>
    <p id="points_output"></p>

    <button id="add_points">Appliquer les points</button>
    
  </main> 

  <script>
    
    const PLAYER_ROLE =
    {
      DEFENDER : 0,
      CALLED : 1,
      ATTACKER : 2
    };
    
    class Player {
      constructor(name, playerNumber) {
        this.nameElement = document.createElement('p');
        this.nameElement.id = 'p' + playerNumber;
        this.nameElement.style.margin = '0';
        this.nameElement.textContent = name;
        this.scoreElement = document.createElement('div');

        this.ps = document.createElement('p');
        this.ps.id = 'ps' + playerNumber;
        this.ps.style.margin = '0';
        this.ps.style.fontWeight = 'bold';
        this.ps.textContent = '0';
        
        this.scoreElement.appendChild(this.ps);

        this.name = name;
        this.scoreList = [0];
        this.totalScore = 0;
        this.role = PLAYER_ROLE.DEFENDER;
      }
      
      addPoints(points, playerNumber) {
        this.scoreList.push(points);
        this.totalScore += points;
        this.ps.textContent = this.totalScore;
        
        const ps = document.createElement('p');
        ps.id = 'ps' + playerNumber + "-" + this.scoreList.length;
        ps.style.margin = '0';
        ps.textContent = points;

        this.scoreElement.appendChild(ps);
      }
      
      setRole(role) {
        this.nameElement.style.color = 'black';
        this.nameElement.style.fontWeight = 'normal';
        
        switch (role) {
          case PLAYER_ROLE.DEFENDER:
          {
            this.nameElement.style.color = 'black';
            this.nameElement.style.fontWeight = 'normal';
            this.role = PLAYER_ROLE.DEFENDER;
            break;
          }
          case PLAYER_ROLE.CALLED:
          {
            this.nameElement.style.color = 'blue';
            this.nameElement.style.fontWeight = 'bold';
            this.role = PLAYER_ROLE.CALLED;
            break;
          }
          case PLAYER_ROLE.ATTACKER:
          {
            this.nameElement.style.color = 'red';
            this.nameElement.style.fontWeight = 'bold';
            this.role = PLAYER_ROLE.ATTACKER;
            break;
          }
          default:
          {
            this.nameElement.style.color = 'black';
            this.nameElement.style.fontWeight = 'normal';
            this.role = PLAYER_ROLE.DEFENDER;
            break;
          }
        }
      }
    }
    class Scoreboard {
      constructor() {
        this.element = document.getElementById('scoreboard');
        this.playerNames = document.getElementById('player_names');
        this.playerScores = document.getElementById('player_scores');
        this.players = [];
      }

      getPlayerIndexByName(name) {
        for (let i = 0; i < this.playerNames.children.length; i++) {
          if (this.playerNames.children[i].textContent === name) {
            return i;
          }
        }
        return -1; // Player not found
      }

      CBPlayerNameClicked(event)
      {
        const playerIndex = this.getPlayerIndexByName(event.target.textContent);
        if(playerIndex == -1) return;

        const thisPlayer = this.players[playerIndex];

        // Attacker
        if(this.hasAttackerDefined() == false)
        {
          this.setAttacker(playerIndex);
          return;
        }
        if(this.hasAttackerDefined() && thisPlayer.role == PLAYER_ROLE.ATTACKER)
        {
          this.clearAttacker();
          thisPlayer.setRole(PLAYER_ROLE.DEFENDER);
          return;
        }

        // Called
        if(this.players.length == 5)
        {
          if(this.hasAttackerDefined() && thisPlayer.role != PLAYER_ROLE.CALLED)
          {
            this.setCalled(playerIndex);
            return;
          }
          if(this.hasAttackerDefined() && thisPlayer.role == PLAYER_ROLE.CALLED)
          {
            this.clearCalled()
            thisPlayer.setRole(PLAYER_ROLE.DEFENDER);
            return;
          }
        }

        // Defender
        thisPlayer.setRole(PLAYER_ROLE.DEFENDER);
      }
      
      addPlayer(player) {
        this.playerNames.appendChild(player.nameElement);
        this.playerScores.appendChild(player.scoreElement);

        player.nameElement.addEventListener('click', (event) => {this.CBPlayerNameClicked(event);});

        this.players.push(player);
      }

      removePlayer(playerName) {
        const index = this.getPlayerIndexByName(playerName);
        if (index !== -1) {
          this.playerNames.removeChild(this.playerNames.children[index]);
          this.playerScores.removeChild(this.playerScores.children[index]);
        }
        this.players = this.players.filter(player => player.name !== playerName);
      }

      getPlayerScore(playerName) {
        const player = this.players.find(player => player.name === playerName);
        if(!player) return 0;
        return player.totalScore;
      }
      addPlayerScore(playerName, score) {
        const playerIndex = this.getPlayerIndexByName(playerName);
        if (playerIndex !== -1) {
          const player = this.players[playerIndex];
          player.addPoints(score, playerIndex);
        }
      }
    
      hasAttackerDefined() {
        for (let i = 0; i < this.players.length; i++)
          if(this.players[i].role == PLAYER_ROLE.ATTACKER) return true;
        return false;
      }
      hasCalledDefined() {
        for (let i = 0; i < this.players.length; i++)
          if(this.players[i].role == PLAYER_ROLE.CALLED) return true;
        return false;
      }

      clearAttacker() {
        for (let i = 0; i < this.players.length; i++)
        {
          if(this.players[i].role == PLAYER_ROLE.ATTACKER)
            this.players[i].setRole(PLAYER_ROLE.DEFENDER);
        }
      }
      clearCalled() {
        for (let i = 0; i < this.players.length; i++)
          if(this.players[i].role == PLAYER_ROLE.CALLED)
            this.players[i].setRole(PLAYER_ROLE.DEFENDER);
      }
      setAttacker(playerIndex)
      {
        this.clearAttacker();
        this.players[playerIndex].setRole(PLAYER_ROLE.ATTACKER);
      }
      setCalled(playerIndex)
      {
        this.clearCalled();
        this.players[playerIndex].setRole(PLAYER_ROLE.CALLED);
      }
    }

    const scoreboard = new Scoreboard();

    document.getElementById('add_player').addEventListener('click', function() {
      const playerName = prompt("Entrez le nom du joueur :");
      if (playerName) {
        const nPlayer = new Player(playerName, scoreboard.playerNames.children.length);
        scoreboard.addPlayer(nPlayer);
      }
    });
    document.getElementById('remove_player').addEventListener('click', function() {
      const playerName = prompt("Entrez le nom du joueur à retirer :");
      if (playerName) {
        scoreboard.removePlayer(playerName);
      }
    });

    // Score calculation

    class Slider {
      constructor(elementId, min, max, step = 1, initialValue = 0) {
        this.element = document.getElementById(elementId);
        this.element.min = min;
        this.element.max = max;
        this.element.step = step;
        this.element.value = initialValue;
        this.element.style.width = '100%';
        this.element.addEventListener('input', updateRecapMessages);

        this.add = document.createElement("button");
        this.add.textContent = "+";
        this.add.addEventListener('click', () => {
          this.element.stepUp();
          updateRecapMessages();
        });

        this.element.parentNode.appendChild(this.add);

        this.sub = document.createElement("button");
        this.sub.textContent = "-";
        this.sub.addEventListener('click', () => {
          this.element.stepDown();
          updateRecapMessages();
        });
        this.element.parentNode.appendChild(this.sub);
      }
      getValue() {
        return parseInt(this.element.value);
      }
      setValue(value) {
        this.element.value = value;
        updateRecapMessages();
      }
    }

    const contractSlider = new Slider('contract_slider', 0, 3, 1, 0);

    const contractText = document.getElementById('contract_text');
    const contractFactor = [1, 2, 4, 6];
    const oudlerSlider = new Slider('oudler_slider', 0, 3, 1, 0);
    const oudlerText = document.getElementById('oudler_text');
    const scoreSlider = new Slider('score_slider', 0, 91, 10, 0);
    const ScoreText = document.getElementById('score_text');
    
    const scoreMessage = document.getElementById('score_message');
    const winMessage = document.getElementById('win_message');
    const pointsOutput = document.getElementById('points_output');

    function hasAttackWin() {
      let oudlerCount = oudlerSlider.getValue();
      let cardScore = scoreSlider.getValue();
      if(oudlerCount === 0 && cardScore >= 56) {
        return true;
      } if(oudlerCount === 1 && cardScore >= 51) {
        return true;
      } if(oudlerCount === 2 && cardScore >= 41) {
        return true;
      } if(oudlerCount === 3 && cardScore >= 36) {
        return true;
      }
      return false;
    }

    function getExtraCardScore() {
      switch (oudlerSlider.getValue()) {
        case 0:
        return scoreSlider.getValue() - 56;
      case 1:
        return scoreSlider.getValue() - 51;
      case 2:
        return scoreSlider.getValue() - 41;
      case 3:
        return scoreSlider.getValue() - 36;
      default:
        return 0;
      }
    }

    function getTotalPointsForAttack() {
      let extraScore = getExtraCardScore();
      let contractIndex = contractSlider.getValue();
      if(extraScore < 0)
        return -1 * contractFactor[contractIndex] * (25 + extraScore);
      else
        return contractFactor[contractIndex] * (25 + extraScore);
    }

    function updateSliderTextValues() {
      oudlerText.textContent = oudlerSlider.getValue();
      ScoreText.textContent = scoreSlider.getValue();

      switch (contractSlider.getValue()) {
      case 0:
        contractText.textContent = "Petite";
        break;
      case 1:
        contractText.textContent = "Garde";
        break;
      case 2:
        contractText.textContent = "Garde Sans";
        break;
      case 3:
        contractText.textContent = "Garde Contre";
        break;
      default:
        contractText.textContent = "";
      }
    }

    function updateRecapMessages() {
      updateSliderTextValues();

      if (hasAttackWin()) {
        winMessage.textContent = "Victoire de l'attaque.";
        scoreMessage.textContent = "Score de " + scoreSlider.getValue() + " pour " + oudlerSlider.getValue() + " bouts.";
        pointsOutput.textContent = "Points gagnés pour l'attaque : " + getTotalPointsForAttack()
          + ", réussie de " + getExtraCardScore();

      } else {
        winMessage.textContent = "Victoire de la défense.";
        scoreMessage.textContent =  "Score de " + scoreSlider.getValue() + " pour " + oudlerSlider.getValue() + " bouts.";
        pointsOutput.textContent = "Points perdus pour l'attaque : " + getTotalPointsForAttack()
          + ", chutée de " + getExtraCardScore();
      }
    }

    function resetSliders() {
      contractSlider.setValue(0);
      oudlerSlider.setValue(0);
      scoreSlider.setValue(0);

      updateRecapMessages();

      winMessage.textContent = "";
      scoreMessage.textContent = "Déplace les jauges pour obtenir un score.";
      pointsOutput.textContent = "";
    }

    document.getElementById('add_points').addEventListener('click', function() {
      if(scoreboard.hasAttackerDefined() == false)
      {
        alert("Veuillez définir un attaquant avant d'appliquer les points.");
        return;
      }

      const totalPoints = getTotalPointsForAttack();
      const attackerCount = 1 + (scoreboard.hasCalledDefined() ? 0.5 : 0);
      let defenderCount = 0;
      for (const player of scoreboard.players) {
        if(player.role == PLAYER_ROLE.DEFENDER)
        {
          console.log("Defender: " + player.name)
          defenderCount++;
        }
          
      }
      
      let defenderFac = attackerCount / defenderCount;
      // switch(defenderCount)
      // {
      //   case 2:
      //     defenderFac = 1/2;
      //     break;
      //   case 3:
      //   {
      //     if(scoreboard.hasCalledDefined())
      //     {
      //       defenderFac = 1.5/3;
      //     }
      //     else
      //       defenderFac = 1/3;
      //   }
      //     break;
      //   case 4:
      //     defenderFac = 1/4;
      // }
      
      console.log(defenderFac);
      for (let i = 0; i < scoreboard.players.length; i++) {
        const player = scoreboard.players[i];
        let scoreToAdd = 0;
        if (player.role == PLAYER_ROLE.ATTACKER) {
          scoreToAdd = totalPoints;
        } else if (player.role == PLAYER_ROLE.CALLED) {
          scoreToAdd = totalPoints * 0.5;
        } else {
          scoreToAdd = -totalPoints * defenderFac;
        }
        scoreToAdd *= (hasAttackWin() ? 1 : -1);
        scoreToAdd = Math.floor(scoreToAdd);
        
        scoreboard.addPlayerScore(player.name, scoreToAdd);
      }

      resetSliders();
      scoreboard.clearAttacker();
      scoreboard.clearCalled();
    });

  </script>

</body>
</html>
